name: API CI

on:
  push:
    branches: [main]
    paths: ['api/**', '.github/workflows/api-ci.yml']
  pull_request:
    paths: ['api/**', '.github/workflows/api-ci.yml']

defaults:
  run:
    working-directory: api

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: estacioncafe
          POSTGRES_PASSWORD: estacioncafe
          POSTGRES_DB: estacioncafe
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U estacioncafe"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:int
      - run: npm run build
