<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EstaciónCafé</title>
    <meta name="theme-color" content="#3d1c42" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      /* Splash inline: pinta la marca antes de que cargue el JS (React la reemplaza al montar) */
      .boot {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #3d1c42;
        margin: 0;
      }
      .boot svg {
        width: 72px;
        height: 72px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-label="Cargando EstaciónCafé">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="20" cy="20" r="18" fill="#d5be9a" />
          <circle cx="20" cy="20" r="12.5" fill="#3d1c42" />
          <path
            d="M11 24c4-7 14-11 19-9"
            fill="none"
            stroke="#d5682a"
            stroke-width="2.4"
            stroke-linecap="round"
          />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
