# Blueprint de Render: API + frontend. New → Blueprint → este repositorio.
services:
  - type: web
    name: estacioncafe-api
    runtime: docker
    rootDir: api
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3484
      - key: CORS_ORIGIN
        sync: false # URL pública del frontend, p. ej. https://estacioncafe-web.onrender.com
      - key: DATABASE_URL
        sync: false # cadena de conexión de Supabase
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN_HOURS
        value: 12
      - key: PIN_PEPPER
        generateValue: true

  - type: web
    name: estacioncafe-web
    runtime: docker
    rootDir: frontend
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 8080
      - key: API_UPSTREAM
        sync: false # URL de la API, p. ej. https://estacioncafe-api.onrender.com
