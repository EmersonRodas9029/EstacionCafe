services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: estacioncafe
      POSTGRES_PASSWORD: estacioncafe
      POSTGRES_DB: estacioncafe
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estacioncafe"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
